services:
  db:
    image: postgres:17
    container_name: sweetstocks-db
    environment:
      POSTGRES_USER: sweetstocks
      POSTGRES_PASSWORD: sweetstocks
      POSTGRES_DB: sweetstocks
    ports:
      # 5433 on the host, because 5432 is often taken by a local Postgres install
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
